# OROHA base: two single-channel MD400 (twin) on one RS485 bus, diff-drive.
#
# `mdrobot_hardware` is NOT a node: robot.launch.py reads it and injects each key
# into the URDF as a xacro arg (controller_manager ignores the section). The
# values are the ones measured on this robot in the 2026-08/09 bringup campaign;
# see 하드웨어_확인표.md §1-§2 before changing anything.
mdrobot_hardware:
  ros__parameters:
    port: /dev/oroha_md400          # udev symlink -> FTDI FT232R serial BG043HTG (setup/udev/99-oroha.rules)
    baudrate: 19200
    motor_id_L: 2                   # slave id 2 = LEFT wheels; mirrored mount, +rpm drives backward
    motor_id_R: 1                   # slave id 1 = RIGHT wheels; +rpm drives forward
    reverse_L: true
    reverse_R: false
    counts_per_rev_L: 30.0          # hall counts per MOTOR-SHAFT revolution (measured 29.97 +- 0.05, n=144)
    counts_per_rev_R: 30.0
    use_limit_sw: 1                 # MUST be 1: enables the CTRL stop gates the E-stop is wired to (pins 6+8, 2-pole NC).
                                    # With 0 the E-stop does NOTHING (T20260928-06). Both directions run with 1 on the
                                    # current wiring (T20260929-01); the old "1 blocks reverse" was pin-8-only wiring (07-29).
    auto_enable: true

controller_manager:
  ros__parameters:
    # twin = 4 serial round-trips per cycle at 19200 baud: ~66 ms with the FTDI
    # latency_timer at 1 ms (udev rule), ~96 ms at the factory 16 ms. 10 Hz is the
    # safe rate; raise only after reading hardware_components.execution_time in
    # /diagnostics on the real bus.
    update_rate: 10

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    # No forward_command_controller on purpose: it has no command timeout, so one
    # published value keeps a wheel turning. Per-wheel checks use diff_cont
    # combinations (v=0.05, w=+-0.2217 -> one side 0.10 m/s, the other 0) or
    # oroha_direction_check (direct Modbus, bounded).

diff_cont:
  ros__parameters:
    left_wheel_names: ["motor_L"]
    right_wheel_names: ["motor_R"]

    # EFFECTIVE radius at the motor shaft, not the tyre: 0.7613 mm/count (6.000 m
    # torque-off hand push, 2026-09-05) x 30 counts/rev / 2pi. Physical rolling
    # radius is 0.1258 m; total drivetrain ratio 34.615 (gearbox 30:1 x belt 26T:30T).
    # Re-measure after re-inflating tyres or changing payload.
    wheel_radius: 0.003635
    wheel_separation: 0.451         # tape, 2026-09-05. 4-wheel skid-steer: effective track for yaw may be larger
    base_frame_id: base_footprint   # URDF root; odom -> base_footprint -> base_link (single TF parent)
    odom_frame_id: odom
    enable_odom_tf: true
    open_loop: false
    position_feedback: true
    publish_rate: 10.0              # odom/TF cannot be faster than update_rate
    publish_limited_velocity: true  # ~/cmd_vel_out: the command actually sent after limits (recorded)

    # host-side stop: the MD400 has no communication watchdog, so a stalled
    # publisher must be caught here (and by the physical E-stop).
    cmd_vel_timeout: 0.5
    # Jazzy: geometry_msgs/TwistStamped on /diff_cont/cmd_vel

    linear:
      x:
        max_velocity: 0.8           # m/s hard cap (3000 rpm = 1.14 m/s); runner/teleop use lower limits
        min_velocity: -0.8
        max_acceleration: 1.0       # m/s^2
        max_deceleration: -1.0      # m/s^2, <= 0 (min_acceleration is deprecated in 4.42)
    angular:
      z:
        max_velocity: 2.0
        min_velocity: -2.0
        max_acceleration: 3.0
        max_deceleration: -3.0

