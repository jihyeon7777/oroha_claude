# Drivetrain / wheel constants under the 2026-10-06 conditions: robot ~50 kg (no payload),
# tyres 10 psi (69 kPa), flat floor. T20261006-06: torque-off hand push along a wall, robot
# front-centre aligned to floor marks exactly 1.500 m apart, there and back (2 legs).
# Re-measure after re-inflating tyres or changing payload (rolling diameter depends on both).
calib_id: wheel-20261006
status: confirmed  # 2 legs x 1.500 m; supersedes wheel-20260909 (no-payload, pressure unknown)
supersedes: wheel-20260909
counts_per_motor_rev: 30.0          # unchanged (measured 29.97 +- 0.05, 2026-09)
total_ratio: 34.615                 # gearbox 30:1 x belt 30T/26T (teeth: exact)
counts_per_wheel_rev: 1038.46       # teeth; tyre-mark check 2026-10-06: 1043 (+0.4 %, mark error)
m_per_count: 0.0007497              # 1.500 m / 2000.75 counts (legs 0.7479 / 0.7515 mm)
rolling_circumference_m: 0.7786     # m_per_count x 1038.46
rolling_diameter_m: 0.2478
wheel_separation_m: 0.451           # tape 2026-09-05 (physical track, not re-measured)
effective_track_m: 0.631            # diff_cont wheel_separation (D-18): in-place turn efficiency 0.7144 +- 0.0012
                                    # (gyro / wheel yaw, 4 runs +-360 deg at 0.5 rad/s, T20261006-12); depends on floor, load, pressure
diff_drive_wheel_radius_effective: 0.003580   # m_per_count * 30 / 2pi (motor-shaft counts)
left_right:
  right_over_left_circumference: 1.0057   # sign-flipping rotation component, -11.5 counts / 2000 per leg; n = 2 legs
  body_rotation_counts_per_leg: 2.5       # non-flipping part (pusher), ~0.2 deg
  note: "indicative only (one round trip); 2026-09-05 had right 0.41 % SMALLER. Not applied as a diff_cont multiplier — check whether straight driving curves left"
uncertainty: "m/count +-0.3 % (front-centre alignment +-3..5 mm per 1.5 m leg; legs differ 0.47 %), track +-2 mm"
conditions: {robot_mass_kg: "~50 (user)", payload_kg: 0, tyre_pressure_kpa: "69 (10 psi, user)", floor: "flat (user)"}
excluded: "push 2 (tyre contact-point marks, left tyre, 2 revs, 1.575 m -> 0.7550 mm/count on the left side): contact patch cannot be located to better than ~1 cm"
